name: Tether WebAssembly & WebGPU
on:
  push:
    branches: [main, "feat/*", "refactor/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-webgl2:
    name: WebGL2 (GLES3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Ensure shader compiler is executable
        run: chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc

      - name: Configure WebGL2 build
        run: |
          emcmake cmake -S . -B build/build-wasm \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON \
            -DCHITRA_BACKEND=GLES3

      - name: Build WebGL2 Sandbox
        run: cmake --build build/build-wasm --target tether_sandbox --parallel 4

      - name: Upload WebGL2 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tether-wasm-webgl2
          path: |
            build/build-wasm/tether_sandbox.html
            build/build-wasm/tether_sandbox.js
            build/build-wasm/tether_sandbox.wasm
            build/build-wasm/tether_sandbox.data

  wasm-webgpu:
    name: WebGPU (WGSL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Ensure shader compiler is executable
        run: chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc

      - name: Configure WebGPU build
        run: |
          emcmake cmake -S . -B build/build-wasm-wgpu \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON \
            -DCHITRA_BACKEND=WGPU

      - name: Build WebGPU Sandbox
        run: cmake --build build/build-wasm-wgpu --target tether_sandbox --parallel 4

      - name: Upload WebGPU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tether-wasm-webgpu
          path: |
            build/build-wasm-wgpu/tether_sandbox.html
            build/build-wasm-wgpu/tether_sandbox.js
            build/build-wasm-wgpu/tether_sandbox.wasm
            build/build-wasm-wgpu/tether_sandbox.data
