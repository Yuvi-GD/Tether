name: Package & Publish Release SDK
# This workflow runs when a release tag is pushed (e.g. v0.0.0)
# or when triggered manually via workflow_dispatch.
# It produces clean Source SDK, platform-specific Precompiled SDKs,
# and standalone Sandbox Demos.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - feat/multiplatform-support
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  init:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            VER=$(grep -E 'project\(.*VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
          fi

  package-source-sdk:
    name: Package Universal Source SDK
    needs: init
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip tar

      - name: Bundle Source SDK
        run: |
          PKG="tether-${RELEASE_TAG}-source-sdk"
          mkdir -p "dist/${PKG}"

          # Core engine source and public headers
          cp -r include src cmake "dist/${PKG}/"
          cp CMakeLists.txt README.md LICENSE "dist/${PKG}/"

          # Lean libyaml (excluding tests and docs)
          mkdir -p "dist/${PKG}/third_party/libyaml"
          cp -r third_party/libyaml/include third_party/libyaml/src "dist/${PKG}/third_party/libyaml/"
          cp third_party/libyaml/CMakeLists.txt "dist/${PKG}/third_party/libyaml/"
          cp third_party/libyaml/License "dist/${PKG}/third_party/libyaml/" 2>/dev/null || cp third_party/libyaml/LICENSE "dist/${PKG}/third_party/libyaml/" 2>/dev/null || true
          cp third_party/libyaml/yamlConfigVersion.cmake.in "dist/${PKG}/third_party/libyaml/" 2>/dev/null || true

          # Lean Chitra (headers, sources, pre-generated shaders, fontstash, stb, and sokol headers)
          # Excludes: 55MB sokol-tools binaries and unused sokol/bindgen/tests/assets
          mkdir -p "dist/${PKG}/third_party/chitra"
          cp -r third_party/chitra/include third_party/chitra/src "dist/${PKG}/third_party/chitra/"
          cp third_party/chitra/CMakeLists.txt "dist/${PKG}/third_party/chitra/"
          cp third_party/chitra/LICENSE "dist/${PKG}/third_party/chitra/" 2>/dev/null || true

          mkdir -p "dist/${PKG}/third_party/chitra/third_party/sokol"
          cp third_party/chitra/third_party/sokol/*.h "dist/${PKG}/third_party/chitra/third_party/sokol/"
          cp third_party/chitra/third_party/sokol/LICENSE "dist/${PKG}/third_party/chitra/third_party/sokol/" 2>/dev/null || true
          cp -r third_party/chitra/third_party/fontstash "dist/${PKG}/third_party/chitra/third_party/"
          cp -r third_party/chitra/third_party/stb "dist/${PKG}/third_party/chitra/third_party/"

          cd dist
          tar -czvf "${PKG}.tar.gz" "${PKG}"
          zip -r "${PKG}.zip" "${PKG}"

      - uses: actions/upload-artifact@v4
        with:
          name: package-source-sdk
          path: |
            dist/*.tar.gz
            dist/*.zip

  package-linux-x64:
    name: Package Linux SDK & Demo (x86_64)
    needs: init
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev ninja-build zip

      - name: Build and Install Linux x86_64 SDK & Demo
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc 2>/dev/null || true
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux_arm64/sokol-shdc 2>/dev/null || true
          PKG_SDK="tether-${RELEASE_TAG}-linux-x64-sdk"
          PKG_DEMO="tether-${RELEASE_TAG}-linux-x64-demo"

          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=ON \
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-release --parallel 4

          # 1. Clean Precompiled SDK
          cmake --install build-release --prefix "dist/${PKG_SDK}"
          cp README.md LICENSE "dist/${PKG_SDK}/"

          # 2. Standalone Showcase Demo
          mkdir -p "dist/${PKG_DEMO}/bin"
          find build-release -type f \( -name "tether_sandbox" -o -name "tether_test" -o -name "tether_bench" \) -exec cp {} "dist/${PKG_DEMO}/bin/" \;
          mkdir -p "dist/${PKG_DEMO}/bin"
          cp -r examples/sandbox/ui/scripts "dist/${PKG_DEMO}/bin/UI"
          cp -r examples/Font "dist/${PKG_DEMO}/bin/Font"
          cp README.md LICENSE "dist/${PKG_DEMO}/"

          cd dist
          tar -czvf "${PKG_SDK}.tar.gz" "${PKG_SDK}"
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          tar -czvf "${PKG_DEMO}.tar.gz" "${PKG_DEMO}"
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/*.zip

  package-linux-arm64:
    name: Package Linux SDK & Demo (arm64)
    needs: init
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev ninja-build zip

      - name: Build and Install Linux ARM64 SDK & Demo
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc 2>/dev/null || true
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux_arm64/sokol-shdc 2>/dev/null || true
          PKG_SDK="tether-${RELEASE_TAG}-linux-arm64-sdk"
          PKG_DEMO="tether-${RELEASE_TAG}-linux-arm64-demo"

          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=ON \
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-release --parallel 4

          # 1. Clean Precompiled SDK
          cmake --install build-release --prefix "dist/${PKG_SDK}"
          cp README.md LICENSE "dist/${PKG_SDK}/"

          # 2. Standalone Showcase Demo
          mkdir -p "dist/${PKG_DEMO}/bin"
          find build-release -type f \( -name "tether_sandbox" -o -name "tether_test" -o -name "tether_bench" \) -exec cp {} "dist/${PKG_DEMO}/bin/" \;
          mkdir -p "dist/${PKG_DEMO}/bin"
          cp -r examples/sandbox/ui/scripts "dist/${PKG_DEMO}/bin/UI"
          cp -r examples/Font "dist/${PKG_DEMO}/bin/Font"
          cp README.md LICENSE "dist/${PKG_DEMO}/"

          cd dist
          tar -czvf "${PKG_SDK}.tar.gz" "${PKG_SDK}"
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          tar -czvf "${PKG_DEMO}.tar.gz" "${PKG_DEMO}"
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-arm64
          path: dist/*.zip

  package-windows-x64:
    name: Package Windows SDK & Demo (x86_64)
    needs: init
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and Install Windows x86_64 SDK & Demo
        shell: pwsh
        run: |
          $pkg_sdk = "tether-${env:RELEASE_TAG}-windows-x64-sdk"
          $pkg_demo = "tether-${env:RELEASE_TAG}-windows-x64-demo"

          cmake -S . -B build-release `
            -A x64 `
            -DTETHER_ENABLE_INSTALL=ON `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DTETHER_BUILD_TESTS=OFF `
            -DTETHER_BUILD_RUNNERS=ON `
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-release --config Release --parallel 4

          # 1. Clean Precompiled SDK
          cmake --install build-release --config Release --prefix "dist\$pkg_sdk"
          Copy-Item "README.md", "LICENSE" "dist\$pkg_sdk\"

          # 2. Standalone Showcase Demo
          New-Item -ItemType Directory -Force -Path "dist\$pkg_demo\bin"
          $bin = Get-ChildItem -Path "build-release" -Filter "tether_sandbox.exe" -Recurse | Select-Object -First 1
          if ($bin) {
            Copy-Item $bin.FullName "dist\$pkg_demo\bin\"
          }

          Get-ChildItem -Path "build-release*" -Include "tether_test.exe", "tether_bench.exe" -Recurse | Copy-Item -Destination "dist\$pkg_demo\bin\"

          New-Item -ItemType Directory -Force -Path "dist\$pkg_demo\bin"
          Copy-Item -Recurse "examples\sandbox\ui\scripts" "dist\$pkg_demo\bin\UI"
          Copy-Item -Recurse "examples\Font" "dist\$pkg_demo\bin\Font"
          Copy-Item "README.md", "LICENSE" "dist\$pkg_demo\"

          Compress-Archive -Path "dist\$pkg_sdk" -DestinationPath "dist\$pkg_sdk.zip"
          Compress-Archive -Path "dist\$pkg_demo" -DestinationPath "dist\$pkg_demo.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: dist/*.zip

  package-windows-arm64:
    name: Package Windows SDK & Demo (arm64)
    needs: init
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and Install Windows ARM64 SDK & Demo
        shell: pwsh
        run: |
          $pkg_sdk = "tether-${env:RELEASE_TAG}-windows-arm64-sdk"
          $pkg_demo = "tether-${env:RELEASE_TAG}-windows-arm64-demo"

          cmake -S . -B build-release-arm64 `
            -A ARM64 `
            -DTETHER_ENABLE_INSTALL=ON `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DTETHER_BUILD_SHARED=OFF `
            -DTETHER_BUILD_TESTS=OFF `
            -DTETHER_BUILD_RUNNERS=ON `
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-release-arm64 --config Release --parallel 4

          # 1. Clean Precompiled SDK
          cmake --install build-release-arm64 --config Release --prefix "dist\$pkg_sdk"
          Copy-Item "README.md", "LICENSE" "dist\$pkg_sdk\"

          # 2. Standalone Showcase Demo
          New-Item -ItemType Directory -Force -Path "dist\$pkg_demo\bin"
          $bin = Get-ChildItem -Path "build-release-arm64" -Filter "tether_sandbox.exe" -Recurse | Select-Object -First 1
          if ($bin) {
            Copy-Item $bin.FullName "dist\$pkg_demo\bin\"
          }

          Get-ChildItem -Path "build-release*" -Include "tether_test.exe", "tether_bench.exe" -Recurse | Copy-Item -Destination "dist\$pkg_demo\bin\"

          New-Item -ItemType Directory -Force -Path "dist\$pkg_demo\bin"
          Copy-Item -Recurse "examples\sandbox\ui\scripts" "dist\$pkg_demo\bin\UI"
          Copy-Item -Recurse "examples\Font" "dist\$pkg_demo\bin\Font"
          Copy-Item "README.md", "LICENSE" "dist\$pkg_demo\"

          Compress-Archive -Path "dist\$pkg_sdk" -DestinationPath "dist\$pkg_sdk.zip"
          Compress-Archive -Path "dist\$pkg_demo" -DestinationPath "dist\$pkg_demo.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-arm64
          path: dist/*.zip

  package-macos:
    name: Package macOS SDK & Demo (arm64)
    needs: init
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: which ninja || brew install ninja

      - name: Build and Install macOS SDK & Demo
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/osx/sokol-shdc 2>/dev/null || true
          chmod +x third_party/chitra/third_party/sokol-tools/bin/osx_arm64/sokol-shdc 2>/dev/null || true
          PKG_SDK="tether-${RELEASE_TAG}-macos-arm64-sdk"
          PKG_DEMO="tether-${RELEASE_TAG}-macos-arm64-demo"

          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=ON \
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-release --parallel 4

          # 1. Clean Precompiled SDK
          cmake --install build-release --prefix "dist/${PKG_SDK}"
          cp README.md LICENSE "dist/${PKG_SDK}/"

          # 2. Standalone Showcase Demo
          mkdir -p "dist/${PKG_DEMO}/bin"
          find build-release -type f \( -name "tether_sandbox" -o -name "tether_test" -o -name "tether_bench" \) -exec cp {} "dist/${PKG_DEMO}/bin/" \;
          mkdir -p "dist/${PKG_DEMO}/bin"
          cp -r examples/sandbox/ui/scripts "dist/${PKG_DEMO}/bin/UI"
          cp -r examples/Font "dist/${PKG_DEMO}/bin/Font"
          cp README.md LICENSE "dist/${PKG_DEMO}/"

          cd dist
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*.zip

  package-android:
    name: Package Android SDK (arm64-v8a)
    needs: init
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Build and Install Android SDK
        run: |
          PKG_SDK="tether-${RELEASE_TAG}-android-arm64-sdk"

          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk-bundle}"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_PATH"

          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-android --target tether tether_sandbox --parallel 4

          # Clean Precompiled SDK
          mkdir -p "dist/${PKG_SDK}/include" "dist/${PKG_SDK}/lib"
          cp -r include/* "dist/${PKG_SDK}/include/"
          cp -r third_party/chitra/include/* "dist/${PKG_SDK}/include/"
          cp third_party/libyaml/include/* "dist/${PKG_SDK}/include/"
          find build-android -name "libtether.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          find build-android -name "libchitra.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          find build-android -name "libyaml.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          cp README.md LICENSE "dist/${PKG_SDK}/"

          cd dist
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          cd ..

          # Package Android Demo (.apk)
          PKG_DEMO="tether-${RELEASE_TAG}-android-arm64-demo"
          mkdir -p "dist/${PKG_DEMO}"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          echo "Using Android JAR: $ANDROID_JAR"

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.tether.sandbox"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="Tether Sandbox"
                  android:hasCode="true">
                  <activity
                      android:name="com.tether.sandbox.SandboxActivity"
                      android:label="Tether Sandbox"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="tether_sandbox" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          "$BUILD_TOOLS/aapt2" link -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            -o apk-unaligned.apk

          mkdir -p apk-staging/lib/arm64-v8a apk-staging/assets/UI apk-staging/assets/Font
          mkdir -p android-classes android-dex
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d android-classes \
            examples/sandbox/platform/android/SandboxActivity.java
          "$BUILD_TOOLS/d8" --min-api 24 --lib "$ANDROID_JAR" --output android-dex \
            android-classes/com/tether/sandbox/SandboxActivity.class
          cp android-dex/classes.dex apk-staging/
          find build-android -name "libtether_sandbox.so" -type f -exec cp {} apk-staging/lib/arm64-v8a/ \;
          cp -r examples/sandbox/ui/scripts/* apk-staging/assets/UI/
          cp -r examples/Font/* apk-staging/assets/Font/
          cd apk-staging && zip -u ../apk-unaligned.apk -r lib assets classes.dex && cd ..

          "$BUILD_TOOLS/zipalign" -v -p 4 apk-unaligned.apk tether_sandbox.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android tether_sandbox.apk

          cp tether_sandbox.apk "dist/${PKG_DEMO}/"
          cp README.md LICENSE "dist/${PKG_DEMO}/"
          cd dist
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: dist/*.zip

  package-ios:
    name: Package iOS SDK (arm64)
    needs: init
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and Install iOS SDK
        run: |
          PKG_SDK="tether-${RELEASE_TAG}-ios-arm64-sdk"

          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON
          cmake --build build-ios --config Release --target tether --parallel 4
          cmake --build build-ios --config Release --target tether_sandbox --parallel 4

          # Clean Precompiled SDK
          mkdir -p "dist/${PKG_SDK}/include" "dist/${PKG_SDK}/lib"
          cp -r include/* "dist/${PKG_SDK}/include/"
          cp -r third_party/chitra/include/* "dist/${PKG_SDK}/include/"
          cp third_party/libyaml/include/* "dist/${PKG_SDK}/include/"
          find build-ios -name "libtether.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          find build-ios -name "libchitra.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          find build-ios -name "libyaml.a" -type f -exec cp {} "dist/${PKG_SDK}/lib/" \;
          cp README.md LICENSE "dist/${PKG_SDK}/"

          cd dist
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          cd ..

          # Package iOS Demo (.app)
          PKG_DEMO="tether-${RELEASE_TAG}-ios-arm64-demo"
          mkdir -p "dist/${PKG_DEMO}"
          find build-ios -name "*.app" -type d -exec cp -r {} "dist/${PKG_DEMO}/" \;
          cp README.md LICENSE "dist/${PKG_DEMO}/"
          cd dist
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: package-ios
          path: dist/*.zip

  package-web:
    name: Package WebAssembly (SDK & Showcase Demo)
    needs: init
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Prepare shader compiler
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux_arm64/sokol-shdc
          mkdir -p third_party/chitra/src/backends/shaders/gen

      - name: Build WebGL2 Precompiled SDK & Demo
        run: |
          PKG_SDK="tether-${RELEASE_TAG}-web-wasm-sdk"

          emcmake cmake -S . -B build-wasm-gl -G Ninja \
            -DTETHER_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON \
            -DCHITRA_BACKEND=GLES3
          cmake --build build-wasm-gl --target tether tether_sandbox --parallel 4

          # 1. Clean Precompiled WebAssembly SDK
          cmake --install build-wasm-gl --prefix "dist/${PKG_SDK}"
          cp README.md LICENSE "dist/${PKG_SDK}/"

      - name: Build WebGPU Demo
        run: |
          emcmake cmake -S . -B build-wasm-wgpu -G Ninja \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON \
            -DCHITRA_BACKEND=WGPU
          cmake --build build-wasm-wgpu --target tether_sandbox --parallel 4

      - name: Bundle Web Showcase Demos
        run: |
          PKG_SDK="tether-${RELEASE_TAG}-web-wasm-sdk"
          PKG_DEMO="tether-${RELEASE_TAG}-web-demo"

          mkdir -p "dist/${PKG_DEMO}/webgl2"
          mkdir -p "dist/${PKG_DEMO}/webgpu"
          find build-wasm-gl -name "tether_sandbox.*" -exec cp {} "dist/${PKG_DEMO}/webgl2/" \;
          find build-wasm-wgpu -name "tether_sandbox.*" -exec cp {} "dist/${PKG_DEMO}/webgpu/" \;
          cp README.md LICENSE "dist/${PKG_DEMO}/"

          cd dist
          zip -r "${PKG_SDK}.zip" "${PKG_SDK}"
          zip -r "${PKG_DEMO}.zip" "${PKG_DEMO}"

      - uses: actions/upload-artifact@v4
        with:
          name: package-web
          path: dist/*.zip

  publish-release:
    name: Publish Draft GitHub Release
    needs:
      - init
      - package-source-sdk
      - package-linux-x64
      - package-linux-arm64
      - package-windows-x64
      - package-windows-arm64
      - package-macos
      - package-android
      - package-ios
      - package-web
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.init.outputs.tag }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find release-downloads/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create or Update GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tether ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
