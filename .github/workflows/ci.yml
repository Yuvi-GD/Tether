name: Tether correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DTETHER_BUILD_TESTS=ON -DTETHER_BUILD_RUNNERS=ON -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --target tether tether_sandbox tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test --parallel 4
      - name: Correctness tests
        run: ctest --test-dir build -C ${{ matrix.config }} -L correctness --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: correctness-${{ matrix.config }}
          path: |
            build/*/report/**/*.json
            build/*/report/**/*.json.txt
            build/Testing/Temporary/LastTest.log
  windows-asan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure instrumented headless validation
        run: cmake -S . -B build-asan -DTETHER_ENABLE_ASAN=ON -DTETHER_BUILD_SHARED=OFF -DTETHER_BUILD_EXAMPLES=OFF -DTETHER_BUILD_RUNNERS=OFF -DTETHER_BUILD_TESTS=ON -DTETHER_ENABLE_INSTALL=OFF
      - name: Build
        run: cmake --build build-asan --config Debug --target tether_test tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test --parallel 4
      - name: Correctness tests under AddressSanitizer
        run: ctest --test-dir build-asan -C Debug -L correctness --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: correctness-asan
          path: |
            build-asan/*/report/**/*.json
            build-asan/*/report/**/*.json.txt
            build-asan/Testing/Temporary/LastTest.log
