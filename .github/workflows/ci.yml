name: Tether correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DTETHER_BUILD_TESTS=ON -DTETHER_BUILD_RUNNERS=ON -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --target tether tether_sandbox tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test tether_yaml_load_test --parallel 4
      - name: Correctness tests
        run: ctest --test-dir build -C ${{ matrix.config }} -L correctness --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-windows-${{ matrix.config }}
          path: |
            build/*/report/**/*.json
            build/*/report/**/*.json.txt
            build/Testing/Temporary/LastTest.log

  windows-asan:
    name: Windows ASan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure instrumented headless validation
        run: cmake -S . -B build-asan -DTETHER_ENABLE_ASAN=ON -DTETHER_BUILD_SHARED=OFF -DTETHER_BUILD_EXAMPLES=OFF -DTETHER_BUILD_RUNNERS=OFF -DTETHER_BUILD_TESTS=ON -DTETHER_ENABLE_INSTALL=OFF
      - name: Build
        run: cmake --build build-asan --config Debug --target tether_test tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test tether_yaml_load_test --parallel 4
      - name: Correctness tests under AddressSanitizer
        run: ctest --test-dir build-asan -C Debug -L correctness --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-windows-asan
          path: |
            build-asan/*/report/**/*.json
            build-asan/*/report/**/*.json.txt
            build-asan/Testing/Temporary/LastTest.log

  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev ninja-build xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DTETHER_BUILD_TESTS=ON -DTETHER_BUILD_RUNNERS=ON -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --target tether tether_sandbox tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test tether_yaml_load_test --parallel 4
      - name: Correctness tests
        run: ctest --test-dir build -L correctness --output-on-failure --no-tests=error
      - name: Sandbox smoke test
        run: |
          if [ -f "./build/${{ matrix.config }}/bin/tether_sandbox" ]; then
            xvfb-run ./build/${{ matrix.config }}/bin/tether_sandbox --smoke
          else
            xvfb-run ./build/bin/tether_sandbox --smoke
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-linux-${{ matrix.config }}
          path: |
            build/**/report/**/*.json
            build/**/report/**/*.json.txt
            build/Testing/Temporary/LastTest.log

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        run: which ninja || brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DTETHER_BUILD_TESTS=ON -DTETHER_BUILD_RUNNERS=ON -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --target tether tether_sandbox tether_ecs_test tether_report_test tether_behavior_test tether_yaml_ast_test tether_yaml_load_test --parallel 4
      - name: Correctness tests
        run: ctest --test-dir build -L correctness --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-macos-${{ matrix.config }}
          path: |
            build/**/report/**/*.json
            build/**/report/**/*.json.txt
            build/Testing/Temporary/LastTest.log

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
      - name: Ensure sokol-shdc is executable
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux/sokol-shdc
          chmod +x third_party/chitra/third_party/sokol-tools/bin/linux_arm64/sokol-shdc
          mkdir -p third_party/chitra/src/backends/shaders/gen
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build-android --target tether tether_sandbox --parallel 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-android-arm64
          path: |
            build-android/bin/tether_sandbox
            build-android/lib/libtether.a

  ios:
    name: iOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Ensure sokol-shdc is executable
        run: |
          chmod +x third_party/chitra/third_party/sokol-tools/bin/osx/sokol-shdc
          chmod +x third_party/chitra/third_party/sokol-tools/bin/osx_arm64/sokol-shdc
          mkdir -p third_party/chitra/src/backends/shaders/gen
      - name: Configure
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
            -DTETHER_BUILD_SHARED=OFF \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_RUNNERS=OFF \
            -DTETHER_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build-ios --config Release --target tether tether_sandbox --parallel 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-ios-arm64
          path: |
            build-ios/Release-iphoneos/**/tether_sandbox.app
            build-ios/Release-iphoneos/**/libtether.a
