Panel:
  flow: NONE
  color: [30, 32, 36, 255]
  children:
    - Panel: # Main App Window
        anchor_min: [0.0, 0.0]
        anchor_max: [1.0, 1.0]
        offset: [20, 20, 20, 20]
        color: [40, 44, 52, 255]
        flow: COLUMN
        padding: [20, 20, 20, 20]
        gap: [0, 15]
        children:
          # ============================================================
          # HEADER
          # ============================================================
          - Panel:
              color: [50, 56, 68, 255]
              flow: ROW
              padding: [15, 15, 15, 15]
              gap: [15, 0]
              children:
                - Text:
                    string: "Tether UI"
                    font_size: 32.0
                    color: [255, 255, 255, 255]
                - Panel: # Spacer
                    fill_ratio: 0.1
                    color: [0, 0, 0, 0]
                - Panel: # Settings Button
                    explicit_size: [130, 40]
                    color: [97, 175, 239, 255]
                    padding: [8, 8, 8, 8]
                    children:
                      - Text:
                          fill_ratio: 1.0
                          string: "Settings"
                          font_size: 20.0
                          color: [30, 32, 36, 255]

          # ============================================================
          # MAIN CONTENT (Sidebar + View)
          # ============================================================
          - Panel:
              fill_ratio: 0.92
              color: [40, 44, 52, 255]
              flow: ROW
              gap: [15, 0]
              children:
                # --- Sidebar ---
                - Panel:
                    fill_ratio: 0.22
                    color: [50, 56, 68, 255]
                    flow: COLUMN
                    padding: [15, 15, 15, 15]
                    gap: [0, 10]
                    children:
                      - Text:
                          string: "Navigation"
                          font_size: 22.0
                          color: [171, 178, 191, 255]
                      - Panel: # Spacer
                          fill_ratio: 1.0
                          color: [0, 0, 0, 0]
                      - Panel: # Nav: Dashboard
                          color: [97, 175, 239, 255]
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Dashboard"
                                font_size: 18.0
                                color: [30, 32, 36, 255]
                      - Panel: # Nav: Analytics
                          color: [62, 68, 81, 255]
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Analytics"
                                font_size: 18.0
                                color: [200, 200, 210, 255]
                      - Panel: # Nav: Reports
                          color: [62, 68, 81, 255]
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Reports"
                                font_size: 18.0
                                color: [200, 200, 210, 255]
                      - Panel: # Nav: Settings
                          color: [62, 68, 81, 255]
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Settings"
                                font_size: 18.0
                                color: [200, 200, 210, 255]

                # --- Main View ---
                - Panel:
                    fill_ratio: 0.78
                    color: [40, 44, 52, 255]
                    flow: COLUMN
                    gap: [0, 15]
                    children:
                      # ---- ROW 1: Color Boxes (fill_ratio test) ----
                      - Panel:
                          fill_ratio: 0.25
                          color: [50, 56, 68, 255]
                          flow: ROW
                          gap: [12, 0]
                          padding: [12, 12, 12, 12]
                          children:
                            - Panel:
                                fill_ratio: 1.0
                                color: [224, 108, 117, 255]
                            - Panel:
                                fill_ratio: 1.0
                                color: [152, 195, 121, 255]
                            - Panel:
                                fill_ratio: 1.0
                                color: [97, 175, 239, 255]
                            - Panel:
                                fill_ratio: 1.0
                                color: [198, 120, 221, 255]

                      # ---- ROW 2: Text Cards (TextWord + TextLabel) ----
                      - Panel:
                          fill_ratio: 0.35
                          color: [40, 44, 52, 255]
                          flow: ROW
                          gap: [12, 0]
                          children:
                            # Card A: Short text (TextWord, <=31 chars)
                            - Panel:
                                fill_ratio: 1.0
                                color: [152, 195, 121, 255]
                                flow: COLUMN
                                padding: [15, 15, 15, 15]
                                gap: [0, 8]
                                children:
                                  - Text:
                                      string: "Active Users"
                                      font_size: 16.0
                                      color: [40, 44, 52, 180]
                                  - Text:
                                      string: "2,847"
                                      font_size: 36.0
                                      color: [40, 44, 52, 255]
                            # Card B: Medium text (TextLabel, <=127 chars)
                            - Panel:
                                fill_ratio: 1.0
                                color: [229, 192, 123, 255]
                                flow: COLUMN
                                padding: [15, 15, 15, 15]
                                gap: [0, 8]
                                children:
                                  - Text:
                                      string: "Revenue"
                                      font_size: 16.0
                                      color: [40, 44, 52, 180]
                                  - Text:
                                      string: "$14,290"
                                      font_size: 36.0
                                      color: [40, 44, 52, 255]
                            # Card C: Fixed size box (explicit_size test)
                            - Panel:
                                fill_ratio: 1.0
                                color: [86, 182, 194, 255]
                                flow: COLUMN
                                padding: [15, 15, 15, 15]
                                gap: [0, 8]
                                children:
                                  - Text:
                                      string: "Uptime"
                                      font_size: 16.0
                                      color: [40, 44, 52, 180]
                                  - Text:
                                      string: "99.97%"
                                      font_size: 36.0
                                      color: [40, 44, 52, 255]

                      # ---- ROW 3: Paragraph + Dynamic Text ----
                      - Panel:
                          fill_ratio: 0.40
                          color: [40, 44, 52, 255]
                          flow: ROW
                          gap: [12, 0]
                          children:
                            # TextParagraph test (wrapping long text)
                            - Panel:
                                fill_ratio: 0.6
                                color: [50, 56, 68, 255]
                                flow: COLUMN
                                padding: [15, 15, 15, 15]
                                gap: [0, 10]
                                children:
                                  - Text:
                                      string: "System Log"
                                      font_size: 18.0
                                      color: [171, 178, 191, 255]
                                  - Text:
                                      fill_ratio: 1.0
                                      string: "Tether uses a pure Data-Oriented Entity Component System. Every UI element is an entity with components stored in dense, contiguous arrays. The two-pass layout solver measures bottom-up then arranges top-down for efficient, cache-friendly traversal."
                                      font_size: 14.0
                                      color: [140, 145, 155, 255]
                            # TextDynamic (heap-allocated) test
                            - Panel:
                                fill_ratio: 0.4
                                color: [50, 56, 68, 255]
                                flow: COLUMN
                                padding: [15, 15, 15, 15]
                                gap: [0, 10]
                                children:
                                  - Text:
                                      string: "Live Status"
                                      font_size: 18.0
                                      color: [171, 178, 191, 255]
                                  - Panel:
                                      color: [152, 195, 121, 60]
                                      padding: [10, 10, 10, 10]
                                      children:
                                        - Text:
                                            string: "Server: Online"
                                            font_size: 14.0
                                            color: [152, 195, 121, 255]
                                  - Panel:
                                      color: [224, 108, 117, 60]
                                      padding: [10, 10, 10, 10]
                                      children:
                                        - Text:
                                            string: "[Alert]: High memory usage detected on node-3"
                                            font_size: 14.0
                                            color: [224, 108, 117, 255]
                                            dynamic: true
