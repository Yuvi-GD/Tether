- Widget:
    name: "StatCard"
    tree:
      - Panel:
          interactable: true
          fill_ratio: 1.0
          color: $card_color
          hover_color: AUTO
          press_color: AUTO
          flow: COLUMN
          padding: [15, 15, 15, 15]
          gap: [0, 8]
          children:
            - Text:
                string: $card_title
                font_size: 16.0
                color: [40, 44, 52, 180]
            - Slot: "children"

- Panel:
  flow: NONE
  color: [30, 32, 36, 255]
  children:
    - Panel: # Main App Window
        anchor_min: [0.0, 0.0]
        anchor_max: [1.0, 1.0]
        offset: [20, 20, 20, 20]
        color: [40, 44, 52, 255]
        flow: COLUMN
        padding: [20, 20, 20, 20]
        gap: [0, 15]
        children:
          # ============================================================
          # HEADER
          # ============================================================
          - Panel:
              color: [50, 56, 68, 255]
              flow: ROW
              padding: [15, 15, 15, 15]
              gap: [15, 0]
              children:
                - Text:
                    string: "Tether UI"
                    font_size: 32.0
                    color: [255, 255, 255, 255]
                - Panel: # Spacer
                    fill_ratio: 0.1
                    color: [0, 0, 0, 0]
                - Panel: # Settings Button
                    id: "SettingsBtn"
                    interactable: true
                    size_box: [130, 40]
                    color: [97, 175, 239, 255]
                    hover_color: AUTO
                    press_color: AUTO
                    padding: [8, 8, 8, 8]
                    border_radius: 10
                    border_width: 5
                    border_color: [30, 32, 36, 255]
                    children:
                      - Text:
                          fill_ratio: 1.0
                          string: "Settings"
                          font_size: 20.0
                          color: [30, 32, 36, 255]

          # ============================================================
          # MAIN CONTENT (Sidebar + View)
          # ============================================================
          - Panel:
              fill_ratio: 0.92
              color: [40, 44, 52, 255]
              flow: ROW
              gap: [15, 0]
              children:
                # --- Sidebar ---
                - Panel:
                    fill_ratio: 0.22
                    color: [50, 56, 68, 255]
                    flow: COLUMN
                    padding: [15, 15, 15, 15]
                    gap: [0, 10]
                    children:
                      - Text:
                          string: "Navigation"
                          font_size: 22.0
                          color: [171, 178, 191, 255]
                      - Panel: # Spacer
                          fill_ratio: 1.0
                          color: [0, 0, 0, 0]
                      - Panel: # Nav: Dashboard (active state)
                          interactable: true
                          color: [97, 175, 239, 255]
                          hover_color: AUTO
                          press_color: AUTO
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Dashboard"
                                font_size: 18.0
                                color: [30, 32, 36, 255]
                      - Panel: # Nav: Analytics
                          interactable: true
                          color: [62, 68, 81, 255]
                          hover_color: AUTO
                          press_color: AUTO
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Analytics"
                                font_size: 18.0
                                color: [200, 200, 210, 255]
                      - Panel: # Nav: Reports
                          interactable: true
                          color: [62, 68, 81, 255]
                          hover_color: AUTO
                          press_color: AUTO
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Reports"
                                font_size: 18.0
                                color: [200, 200, 210, 255]
                      - Panel: # Nav: Settings
                          interactable: true
                          color: [62, 68, 81, 255]
                          hover_color: AUTO
                          press_color: AUTO
                          padding: [12, 12, 12, 12]
                          children:
                            - Text:
                                string: "Settings"
                                font_size: 18.0
                                color: [200, 200, 210, 255]

                # --- Main View ---
                - Scene: "../../examples/UI/dashboard.yaml"