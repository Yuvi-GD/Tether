Panel:
  flow: COLUMN
  fill_ratio: 1
  color: [33, 33, 36, 255]
  padding: 20
  border_radius: 8
  gap: [0, 12]
  children:
    - Text:
        string: "An interface built from small pieces"
        font_size: 24
        color: [230, 230, 230, 255]
    - Text:
        string: "Tether is a C engine for building user interfaces from entities, components and reusable widgets. This dashboard is assembled from YAML, while native C code connects actions and updates the interface at runtime. Explore the examples to see how the same pieces can be composed into different experiences."
        font_size: 16
        color: [185, 185, 185, 255]
    - Container:
        flow: ROW
        gap: [12, 0]
        children:
          - StatCard:
              card_color: [95, 145, 180, 255]
              card_title: "COMPOSE"
              children:
                - Text:
                    string: "Build a tree"
                    font_size: 22
                    color: [25, 35, 43, 255]
                - Text:
                    string: "Combine panels, text and widgets."
                    font_size: 15
                    color: [35, 45, 53, 255]
          - StatCard:
              card_color: [125, 165, 140, 255]
              card_title: "CONNECT"
              children:
                - Text:
                    string: "Bind actions"
                    font_size: 22
                    color: [25, 35, 28, 255]
                - Text:
                    string: "Use C callbacks to update a UI."
                    font_size: 15
                    color: [35, 45, 38, 255]
          - StatCard:
              card_color: [175, 150, 110, 255]
              card_title: "EXPERIMENT"
              children:
                - Text:
                    string: "Edit YAML"
                    font_size: 22
                    color: [38, 32, 24, 255]
                - Text:
                    string: "Load a different layout at runtime."
                    font_size: 15
                    color: [48, 42, 34, 255]
    - Container:
        flow: ROW
        gap: [12, 0]
        fill_ratio: 1
        children:
          - Panel:
              flow: COLUMN
              fill_ratio: 1
              padding: 18
              gap: [0, 10]
              color: [40, 40, 44, 255]
              border_radius: 8
              children:
                - Text:
                    string: "How this example is made"
                    font_size: 20
                    color: [225, 225, 225, 255]
                - Text:
                    string: "The dashboard is described in UI/dashboard.yaml. Its cards use a reusable widget declared in UI/index.yaml, with colors and content supplied for each instance. Panels, text and controls form a tree that can be arranged and updated through Tether's component APIs."
                    font_size: 16
                    color: [180, 180, 180, 255]
                - Text:
                    string: "The Examples tab demonstrates interactive state and overlays. The playground loads separate YAML files into a preview area, so you can experiment with the structure and see the result in the running application."
                    font_size: 16
                    color: [180, 180, 180, 255]
          - Panel:
              flow: COLUMN
              fill_ratio: 1
              padding: 18
              gap: [0, 10]
              color: [40, 40, 44, 255]
              border_radius: 8
              children:
                - Text:
                    string: "Explore the scripts"
                    font_size: 20
                    color: [225, 225, 225, 255]
                - Text:
                    string: "Scripts are copied beside the sandbox executable in the UI folder. Edit a file and use Refresh, or load a YAML file in the playground. The predefined scenes offer starting points for exploring layout, text, colors and widget composition."
                    font_size: 16
                    color: [180, 180, 180, 255]
                - Text:
                    string: "Chitra renders this demonstration as an independent backend. The Lab launches workloads in separate executables and lets you import their reports. The Gallery shows the built-in widgets in enabled and disabled states."
                    font_size: 16
                    color: [180, 180, 180, 255]
